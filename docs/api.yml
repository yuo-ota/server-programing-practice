openapi: 3.0.0
info:
  title: server programming project API
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: Local development server
paths:
  /api/login:
    post:
      summary: ログイン
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email_address:
                  type: string
                password:
                  type: string
      responses:
        "200":
          description: ログインできた場合
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
        "400":
          description: パラメーターが不正の場合
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  message:
                    type: string
        "401":
          description: ユーザーIDが不正の場合
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  message:
                    type: string
        "500":
          description: SQLエラー等の全般的なエラーの発生
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  message:
                    type: string

