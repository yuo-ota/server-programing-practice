      summary: アカウント編集, ユーザー設定
      parameters:
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
          description: "Bearer トークンを入れる（例: Bearer <JWT>）"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                user_id:
                  type: string
                name:
                  type: string
                icon:
                  type: string
                  format: binary
                header:
                  type: string
                  format: binary
                social_accounts:
                  type: array
                  items:
                    type: object
                    properties:
                      platform_id:
                        type: integer
                      identifier:
                        type: string
                introduction:
                  type: string
                birthday:
                  type: string
                show_adult_contents:
                  type: boolean
