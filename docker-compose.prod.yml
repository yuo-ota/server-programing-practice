services:
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: spp-backend
    depends_on:
      - postgres
      - init-images
    volumes:
      - images:/usr/share/nginx/images
    working_dir: /app
    env_file:
      - .env
      - .env.prod
    expose:
      - "8080"
    networks:
      - project-network
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    volumes:
      - frontend-build:/app/dist
    command: ["true"]

  postgres:
    image: postgres:16
    container_name: spp-postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env
      - .env.prod
    environment:
      - TZ=${TIMEZONE}
    expose:
      - "5432"
    networks:
      - project-network

  nginx:
    image: nginx:stable
    volumes:
      - ./nginx:/etc/nginx
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - images:/usr/share/nginx/images
      - frontend-build:/usr/share/nginx/html
    ports:
      - "${NGINX_PORT}:443"
    env_file:
      - .env
      - .env.prod
    environment:
      DOLLAR: $
    depends_on:
      - app
    command: /bin/sh -c 'envsubst < /etc/nginx/conf.d/default.conf.template > /etc/nginx/conf.d/default.conf && nginx -g "daemon off;"'
    networks:
      - project-network
    restart: always

  init-images:
    image: alpine
    command: >
      sh -c "if [ -z \"$(ls -A /usr/share/nginx/images)\" ]; then
              cp -R /seed/* /usr/share/nginx/images/;
              echo 'Images seeded.';
            else
              echo 'Images directory already populated, skipping seed copy.';
            fi"
    volumes:
      - images:/usr/share/nginx/images
      - ./seed-images:/seed

volumes:
  frontend-build:
  postgres_data:
  images:

networks:
  project-network:
    driver: bridge